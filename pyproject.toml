[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqc"
version = "0.1.0"
description = "Hybrid Quantum-AI Intelligence Framework for Cyberattack Chain Prediction and Adaptive Defense (research prototype)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - research prototype (see README)" }
# Milestone 1 runtime dependencies only. ML, PyTorch and Qiskit are added by the
# milestones that need them (see docs/DEVELOPMENT.md).
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0,<7",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["hqc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: multi-module tests",
    "guardrail: safety-boundary tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]
extend-exclude = ["frontend", "notebooks", "data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["hqc", "factories"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
packages = ["hqc"]
strict = true
plugins = ["pydantic.mypy"]
