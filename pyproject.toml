[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqc"
version = "0.1.0"
description = "Hybrid Quantum-AI Intelligence Framework for Cyberattack Chain Prediction and Adaptive Defense (research prototype)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - all rights reserved (research prototype; see README)" }
# Runtime dependencies. The quantum simulators (Milestone 6) are the optional
# "quantum" extra (see docs/DEVELOPMENT.md).
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0,<7",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "certifi>=2024.2",  # CA bundle for verified HTTPS downloads of official sources
    "torch>=2.4,<3",  # Milestone 4 LSTM (CPU)
    "numpy>=2,<3",  # Milestone 5 detection
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",  # model persistence (detection, quantum adjudicator); also a scikit-learn dependency
    "scipy>=1.11,<2",  # Milestone 6 (also a scikit-learn dependency)
]

[project.optional-dependencies]
quantum = [
    "qiskit==2.5.2",  # Milestone 6: feature-map reference circuits and Statevector validation
    "qiskit-aer==0.17.2",  # Milestone 6: noisy shot-based kernel study only
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["hqc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: multi-module tests",
    "guardrail: safety-boundary tests",
    "requires_data: needs downloaded/processed ATT&CK or Attack Flow data (skips if absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]
extend-exclude = ["frontend", "data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["hqc", "factories", "stix_builders", "prediction_fixtures", "cic_fixtures", "m7_fixtures"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
packages = ["hqc"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# scikit-learn, joblib, SciPy, Qiskit and Qiskit Aer ship no usable type information here.
module = ["sklearn.*", "joblib", "scipy.*", "qiskit.*", "qiskit_aer.*"]
ignore_missing_imports = true
